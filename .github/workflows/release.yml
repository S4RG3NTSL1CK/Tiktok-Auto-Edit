name: Release Windows build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Write version into app
        shell: bash
        run: echo "__version__ = \"${{ steps.version.outputs.version }}\"" > app/version.py

      - name: Install Python dependencies
        # opencv-python-headless must land before scenedetect, and scenedetect
        # must install with --no-deps: it hard-depends on non-headless
        # opencv-python, which conflicts on-disk with the headless build (both
        # install into the same cv2/ package dir) and breaks PySide6's Qt
        # platform plugin at runtime. See README for the full explanation.
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 opencv-python-headless numpy scipy soundfile requests imageio-ffmpeg platformdirs click tqdm faster-whisper pyinstaller
          pip install --no-deps scenedetect

      - name: Build with PyInstaller
        run: pyinstaller build.spec

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.version.outputs.version }} installer.iss

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: installer_output/*.exe
          generate_release_notes: true
